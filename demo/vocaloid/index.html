<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vocaloid — 声の質感を変える</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edeef5;background:#13151d;color-scheme:dark}body{max-width:720px;margin:6vh auto;padding:24px}h1{font-size:3rem;letter-spacing:-.04em;margin-bottom:8px}p{color:#b6bacc;line-height:1.8}.tag{color:#79e2c1;letter-spacing:.15em;font-size:.8rem}.panel{background:#202430;border:1px solid #3a4052;border-radius:18px;padding:26px;margin:30px 0}label{display:block;font-weight:600;margin-bottom:16px}input[type=file]{width:100%;padding:12px 0}input[type=range]{width:100%;accent-color:#79e2c1}output{float:right;color:#79e2c1;font-variant-numeric:tabular-nums}.scale{display:flex;justify-content:space-between;color:#a6adc2;font-size:.8rem;margin:8px 0 26px}.actions{display:flex;flex-wrap:wrap;gap:10px}button{border:1px solid #555f78;border-radius:9px;background:#30394d;color:white;padding:12px 18px;cursor:pointer}button.primary{background:#79e2c1;color:#14221d;border-color:#79e2c1;font-weight:700}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #79e2c1;outline-offset:4px}#status{min-height:3em}small{color:#9ca5be;line-height:1.7}a{color:#79e2c1}
</style>
</head>
<body>
<div class="tag">VOICE TEXTURE / LOCAL AUDIO</div>
<h1>vocaloid</h1>
<p>音程はそのままに、声を明るく、均一な質感へ。<br>歌声ファイルを読み込み、強度を選んで聴き比べます。</p>
<div class="panel">
<label for="file">1. 歌声を読み込む <input id="file" type="file" accept="audio/wav,audio/mpeg,.wav,.mp3"></label>
<p id="fileInfo">WAV / MP3 · ファイルは端末内だけで処理されます</p>
<label for="amount">2. エフェクトの強度 <output id="amountValue" for="amount">0.50</output></label>
<input id="amount" type="range" min="0" max="1" step="0.01" value="0.5">
<div class="scale"><span>0 — 原音</span><span>1 — 強い質感</span></div>
<div class="actions">
<button id="process" class="primary" disabled>この強度で処理</button>
<button id="original" disabled>原音を再生</button>
<button id="play" disabled>処理音を再生</button>
<button id="stop" disabled>停止</button>
<button id="export" disabled>MP3 を保存</button>
</div>
<p id="status" role="status" aria-live="polite">歌声ファイルを選んでください。</p>
</div>
<small>音程補正なし · ピッチ変更なし · 192 kbps MP3<br>原音に戻すには強度を 0 にして処理してください。<br>MP3 encoder: <a href="https://github.com/zhuker/lamejs">lamejs / LAME (LGPL)</a></small>
<script type="module" src="app.js"></script>
</body>
</html>
